site_name: "정보 2단원 데이터"
site_description: "씨마스 2022 개정 정보 교과서 2단원(데이터)과 완전 연계한 실습 가이드입니다. 압축·암호화 개념 이해부터 오렌지3를 활용한 빅데이터 수집·전처리·시각화, 구글 도구를 활용한 과제 제출까지 8차시에 걸쳐 단계적으로 경험합니다."
site_author: Created with EduFlow

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: "다크 모드로 전환"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: "라이트 모드로 전환"
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/title-link.js

extra_css:
  - stylesheets/custom.css

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - "Part 1 - Part 1. 데이터를 지켜라 — 압축과 암호화":
    - "데이터가 너무 커요! — 압축이 필요한 이유": 1-1.md
    - "비밀을 지켜라! — 암호화의 세계": 1-2.md
  - "Part 2 - Part 2. 빅데이터란 무엇인가 — 수집과 준비":
    - "데이터가 폭발한다! — 빅데이터의 3V와 수집 방법": 2-1.md
    - "오렌지3, 처음 만나기 — 설치부터 첫 워크플로우까지": 2-2.md
  - "Part 3 - Part 3. 데이터를 다듬어라 — 빅데이터 전처리":
    - "빠진 값, 이상한 값을 잡아라! — 결측치와 이상치 처리": 3-1.md
    - "데이터를 합치고 나누기 — 통합과 정규화": 3-2.md
  - "Part 4 - Part 4. 데이터를 눈에 보이게 — 빅데이터 시각화":
    - "데이터를 그림으로 — 박스플롯, 히스토그램, 산점도": 4-1.md
    - "지도와 시간으로 보는 데이터 — 지리·시간 데이터 시각화": 4-2.md
  - "Part 5 - Part 5. 이미지와 텍스트도 데이터다 — 비정형 데이터 시각화":
    - "사진도 데이터다 — 이미지 데이터 시각화": 5-1.md
    - "글자도 데이터다 — 텍스트 데이터 시각화": 5-2.md
  - "Part 6 - Part 6. 데이터로 문제를 해결하라 — 협력적 창의·융합 프로젝트":
    - "문제를 발견하라 — 안전사고 데이터 수집과 전처리": 6-1.md
    - "데이터로 이야기하라 — 안전사고 데이터 시각화와 인사이트 도출": 6-2.md
  - "Part 7 - Part 7. 나의 데이터 이야기를 완성하라 — 보고서와 발표":
    - "보고서를 완성하라 — 구글 슬라이드로 분석 결과 정리하기": 7-1.md
    - "발표하고 피드백하라 — 모둠 발표와 동료 평가": 7-2.md
  - "Part 8 - Part 8. 마무리와 다음 여정 — 최종 점검과 성찰":
    - "최종 점검 — 루브릭으로 셀프 체크하기": 8-1.md
    - "돌아보기 그리고 앞으로 — 성찰과 다음 여정": 8-2.md
